<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiz IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --display: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --bg: #f6f3ec; --ink: #17161a; --muted: #6b6760; --card: #fffdf8; --line: #e3ddd0;
    --accent: #2f4bff; --accent-ink: #fff; --good: #138a4f; --bad: #c2412d;
    --c0: #2f4bff; --c1: #ff6b35; --c2: #13a07a; --c3: #b04ad6;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 17px/1.45 var(--body);
         min-height: 100dvh; display: flex; flex-direction: column; padding: max(16px, env(safe-area-inset-top)) 16px 24px; }
  header { display: flex; justify-content: space-between; align-items: center; font-weight: 600; color: var(--muted); font-size: 14px; }
  .brand { font-family: var(--display); font-weight: 800; color: var(--ink); font-size: 18px; letter-spacing: -.01em; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; }
  .dot.off { background: var(--bad); }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 520px; width: 100%; margin: 0 auto; padding-top: 24px; }
  .step { font-size: 14px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  h1 { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.15; letter-spacing: -.02em; margin-bottom: 22px; }
  .wait h1 { font-size: 30px; }
  .wait p { color: var(--muted); }
  .options { display: grid; gap: 12px; }
  button.opt { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 18px 18px;
               background: var(--card); border: 2px solid var(--line); border-radius: 16px; font-weight: 600; font-size: 18px;
               cursor: pointer; transition: transform .08s, border-color .15s, background .15s; -webkit-tap-highlight-color: transparent; }
  button.opt:active { transform: scale(.98); }
  .swatch { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-family: var(--display); font-weight: 800; }
  button.opt.chosen { border-color: var(--ink); background: var(--ink); color: var(--bg); }
  button.opt[disabled] { cursor: default; }
  button.opt.dim { opacity: .45; }
  button.opt.right { border-color: var(--good); background: #e6f5ec; color: var(--ink); opacity: 1; }
  button.opt.wrong { border-color: var(--bad); background: #fbe9e5; color: var(--ink); opacity: 1; }
  .status { margin-top: 18px; min-height: 24px; font-weight: 600; text-align: center; }
  .status.ok { color: var(--good); }
  .explain { margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; color: var(--ink); }
  form.text { display: grid; gap: 12px; }
  input { font: inherit; font-size: 20px; padding: 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); color: var(--ink); width: 100%; }
  input:focus { outline: none; border-color: var(--accent); }
  .send { all: unset; text-align: center; padding: 16px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 18px; cursor: pointer; }
  .pulse { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); margin-bottom: 24px; animation: p 1.6s ease-in-out infinite; }
  @keyframes p { 50% { transform: scale(.75); opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
</style>
</head>
<body>
<header><span class="brand">Quiz IA</span><span id="conn"><span class="dot"></span>Connecté</span></header>
<main id="app"></main>
<script src="/socket.io/socket.io.js"></script>
<script>
  const COLORS = ['var(--c0)', 'var(--c1)', 'var(--c2)', 'var(--c3)'];
  const LETTERS = 'ABCDEFGH';
  let clientId;
  try { clientId = localStorage.getItem('quiz-client') || crypto.randomUUID(); localStorage.setItem('quiz-client', clientId); }
  catch { clientId = Math.random().toString(36).slice(2); }

  const socket = io({ auth: { clientId } });
  const app = document.getElementById('app');
  const conn = document.getElementById('conn');
  let current = null, myVote = null;

  socket.on('connect', () => conn.innerHTML = '<span class="dot"></span>Connecté');
  socket.on('disconnect', () => conn.innerHTML = '<span class="dot off"></span>Reconnexion…');
  socket.on('state', (s) => { current = s; render(); });
  socket.on('myvote', (v) => { myVote = v; render(); });

  function el(tag, attrs = {}, text) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) k === 'class' ? e.className = v : e.setAttribute(k, v);
    if (text != null) e.textContent = text;
    return e;
  }

  function render() {
    if (!current) return;
    const s = current, q = s.question;
    app.replaceChildren();

    if (!q) {
      const w = el('div', { class: 'wait' });
      w.append(el('div', { class: 'pulse' }), el('h1', {}, 'Vous êtes connecté !'), el('p', {}, 'Le quiz va commencer. Gardez cette page ouverte.'));
      app.append(w); return;
    }

    app.append(el('div', { class: 'step' }, `Question ${s.index + 1} / ${s.count}`), el('h1', {}, q.title));
    const status = el('div', { class: 'status' });

    if (q.type === 'text') {
      if (s.phase === 'open') {
        const f = el('form', { class: 'text' });
        const input = el('input', { maxlength: '40', placeholder: q.hint || 'Votre réponse', autocomplete: 'off', enterkeyhint: 'send' });
        if (myVote) input.value = myVote;
        f.append(input, el('button', { class: 'send', type: 'submit' }, myVote ? 'Modifier' : 'Envoyer'));
        f.onsubmit = (e) => { e.preventDefault(); if (input.value.trim()) socket.emit('vote', { index: s.index, answer: input.value }); input.blur(); };
        app.append(f);
        if (myVote) { status.className = 'status ok'; status.textContent = `Envoyé : « ${myVote} »`; }
      } else {
        status.textContent = myVote ? `Votre réponse : « ${myVote} ». Regardez l'écran !` : "Les réponses sont fermées. Regardez l'écran !";
      }
      app.append(status); return;
    }

    const box = el('div', { class: 'options' });
    const revealed = s.phase === 'reveal' && q.correct != null;
    q.options.forEach((label, i) => {
      const b = el('button', { class: 'opt', type: 'button' });
      const sw = el('span', { class: 'swatch' }, LETTERS[i]); sw.style.background = COLORS[i % COLORS.length];
      b.append(sw, el('span', {}, label));
      if (myVote === i) b.classList.add('chosen');
      if (s.phase !== 'open') {
        b.disabled = true;
        if (revealed) {
          if (i === q.correct) b.classList.add('right');
          else if (myVote === i) b.classList.add('wrong');
          else b.classList.add('dim');
        } else if (myVote !== i) b.classList.add('dim');
      } else {
        b.onclick = () => { navigator.vibrate?.(15); socket.emit('vote', { index: s.index, answer: i }); };
      }
      box.append(b);
    });
    app.append(box);

    if (s.phase === 'open') {
      if (myVote != null) { status.className = 'status ok'; status.textContent = 'Réponse enregistrée. Vous pouvez encore changer.'; }
    } else if (revealed) {
      if (myVote === q.correct) { status.className = 'status ok'; status.textContent = 'Bonne réponse ! 🎉'; }
      else status.textContent = myVote == null ? "Vous n'avez pas répondu." : 'Raté, pas grave !';
    } else status.textContent = s.phase === 'reveal' ? "Regardez l'écran !" : 'Votes fermés.';
    app.append(status);

    if (s.phase === 'reveal' && q.explanation) app.append(el('div', { class: 'explain' }, q.explanation));
  }
</script>
</body>
</html>
